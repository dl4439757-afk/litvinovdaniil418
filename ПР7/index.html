<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вёрстка и валидация форм</title>
<link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<header class="header">
<h1>Регистрация пользователя</h1>
<p>Заполните форму для создания аккаунта</p>
</header>
<main class="main">
<form class="registration-form" id="registrationForm" novalidate>
<fieldset class="form-section">
<legend>Личная информация</legend>
<div class="form-group">
<label for="firstName" class="required">Имя</label>
<input type="text" id="firstName" name="firstName" required minlength="2" maxlength="50" placeholder="Введите имя">
<span class="error-message" id="firstNameError"></span>
</div>
<div class="form-group">
<label for="lastName" class="required">Фамилия</label>
<input type="text" id="lastName" name="lastName" required minlength="2" maxlength="50" placeholder="Введите фамилию">
<span class="error-message" id="lastNameError"></span>
</div>
<div class="form-group">
<label for="email" class="required">Email</label>
<input type="email" id="email" name="email" required placeholder="example@mail.com">
<span class="error-message" id="emailError"></span>
</div>
</fieldset>
<fieldset class="form-section">
<legend>Безопасность</legend>
<div class="form-group">
<label for="password" class="required">Пароль</label>
<input type="password" id="password" name="password" required minlength="8" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$" placeholder="Минимум 8 символов">
<span class="error-message" id="passwordError"></span>
</div>
<div class="form-group">
<label for="confirmPassword" class="required">Подтверждение</label>
<input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Повторите пароль">
<span class="error-message" id="confirmPasswordError"></span>
</div>
</fieldset>
<div class="form-actions">
<button type="submit" class="btn btn-primary">Зарегистрироваться</button>
<button type="reset" class="btn btn-secondary">Очистить</button>
</div>
</form>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
